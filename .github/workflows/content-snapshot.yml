# ============================================================================
# 内容发布：Supabase → git 快照 → 回归闸 → 提交 main → Pages 自动重建
#
# 触发方式：后台「发布」按钮（Pages Function /api/publish → workflow_dispatch），
#          或在本仓库 Actions 页手动 Run workflow。
# 需要的仓库 Secrets：
#   SUPABASE_URL          https://xxxx.supabase.co
#   SUPABASE_SECRET_KEY   sb_secret_xxx（service/secret key，只有本 Action 能用）
# 说明：本 Action 提交前必须过 build + verify:site，坏快照绝不进 main。
#       verify:site 只校“本站自洽”（canonical/H1/sitemap/_redirects），
#       不再拿旧站 URL 清单当尺子 —— 新建文章与下架旧文章都能正常发布。
# ============================================================================
name: Content snapshot

run-name: 内容快照 · ${{ github.event.inputs.reason || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 触发来源（写进 commit 信息）
        required: false
        default: admin

# 同一时间只跑一次：两次快照并发会互相覆盖提交
concurrency:
  group: content-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 变量注入自检（只报有无，不报内容）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node -e "const k=['SUPABASE_URL','SUPABASE_SECRET_KEY'];let bad=0;for(const n of k){const v=process.env[n];if(!v){console.log('❌ '+n+' 未注入（去 Settings→Secrets and variables→Actions 核对名字）');bad++}else{console.log('✓ '+n+' 已注入，'+v.length+' 字符，开头：'+(n==='SUPABASE_URL'?v:v.slice(0,10)+'…'))}}process.exit(bad?1:0)"
          npx tsx --version

      - name: 从 Supabase 生成内容快照
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run snapshot

      - name: 回归闸（整站构建 + 自洽校验）
        run: |
          npm run build
          npm run verify:site

      - name: 提交并推送（无变化则跳过）
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "内容无变化，不提交。"
            exit 0
          fi
          echo "本次发布变更："
          git status --porcelain | head -50
          git config user.name "cennetic-cms"
          git config user.email "cms@cennetic.com"
          git add -A
          git commit -m "内容发布：Supabase 快照（${{ github.event.inputs.reason || 'manual' }}）"
          git push origin HEAD:main

      # 失败时把原因重跑一遍写到 Summary 顶部，非技术同事不用再去翻日志
      - name: 失败原因写到 Summary
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          {
            echo "### ❌ 本次发布未完成，原因如下（只读校验，不会改任何文件）"
            echo '```'
            npm run snapshot:check 2>&1 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
